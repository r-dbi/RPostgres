# This workflow calls the GitHub API very frequently.
# Can't be run as part of commits
on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC every day only run on main branch
  push:
    tags:
      - "v*"
  workflow_dispatch:

name: rcc dev

# Read-only by default; the jobs that need more opt back in below.
permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 30 # longest run seen: 2 min
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    name: Collect deps

    steps:
      - uses: actions/checkout@v7

      - name: Report the GitHub API rate limit
        uses: cynkra/cynkratemplate/.github/actions/rate-limit@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2

      - name: Collect the dependencies into a matrix
        id: set-matrix
        uses: cynkra/cynkratemplate/.github/actions/dep-matrix@main

  check-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 15 # longest run seen: 1 min
    needs: matrix

    name: Check deps

    steps:
      - uses: actions/checkout@v7

      - name: Check matrix definition
        uses: cynkra/cynkratemplate/.github/actions/matrix-check@main
        with:
          matrix: ${{ needs.matrix.outputs.matrix }}

  R-CMD-check-base:
    runs-on: ubuntu-26.04
    timeout-minutes: 120 # longest run seen: 46 min

    name: base

    outputs:
      binary: ${{ steps.binary.outputs.artifact-name }}

    permissions:
      # Both required by the update-snapshots action, which opens a pull
      # request with refreshed snapshots.
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Run the repository-specific before-install steps
        uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - name: Install R and the package dependencies
        uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          cache-version: rcc-dev-base-1
          needs: build, check
          extra-packages: "any::rcmdcheck any::remotes"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Session info
        uses: cynkra/cynkratemplate/.github/actions/session-info@main

      - name: Run the repository-specific after-install steps
        uses: ./.github/workflows/custom/after-install
        if: hashFiles('.github/workflows/custom/after-install/action.yml') != ''

      - name: Build, install and upload the binary package
        id: binary
        uses: cynkra/cynkratemplate/.github/actions/build-binary@main
        with:
          name: ubuntu-26.04-rrelease-base

      - name: Update the testthat snapshots
        id: snapshots
        continue-on-error: true
        uses: cynkra/cynkratemplate/.github/actions/update-snapshots@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Run R CMD check
        uses: cynkra/cynkratemplate/.github/actions/check@main
        with:
          results: base

      - name: Fail if a snapshot pull request was opened
        if: always() && steps.snapshots.outputs.pull-request-number != ''
        env:
          PR_NUMBER: ${{ steps.snapshots.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Snapshot pull request #${PR_NUMBER} was opened, see ${RUN_URL}"
          exit 1
        shell: bash

  R-CMD-check-dev:
    needs:
      - matrix
      - R-CMD-check-base

    runs-on: ubuntu-26.04
    timeout-minutes: 120 # longest run seen: 57 min

    name: 'rcc-dev: ${{ matrix.package }}'

    permissions:
      # Both required by the update-snapshots action.
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      - uses: actions/checkout@v7

      - name: Run the repository-specific before-install steps
        uses: ./.github/workflows/custom/before-install
        if: hashFiles('.github/workflows/custom/before-install/action.yml') != ''

      - name: Install R and the package dependencies
        uses: cynkra/cynkratemplate/.github/actions/install@main
        with:
          cache-version: rcc-dev-${{ matrix.package }}-1
          needs: build, check
          extra-packages: "any::rcmdcheck any::jsonlite"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same runner and R version as the base job, so its binary fits.
      - name: Install the package from the base job's binary
        uses: cynkra/cynkratemplate/.github/actions/install-binary@main
        with:
          name: ${{ needs.R-CMD-check-base.outputs.binary }}

      - name: Install dev version of ${{ matrix.package }}
        run: |
          # r-universe builds Linux binaries for ubuntu:latest, which now tracks
          # 26.04 "resolute" (it no longer publishes "noble"). This matches the
          # ubuntu-26.04 runner above.
          distro <- "resolute"
          package <- "${{ matrix.package }}"

          search_results <- function(package) {
            url <- paste0("https://r-universe.dev/api/search?q=package:", package)
            jsonlite::fromJSON(url, simplifyVector = FALSE)$results
          }

          # The canonical universe of a package: among the search results for exactly
          # this package, the one r-universe indexes as canonical (`_indexed`),
          # else the first one that is not the CRAN mirror.
          universe_for <- function(package, results = search_results(package)) {
            matches <- Filter(function(x) identical(x$Package, package), results)
            universes <- unique(vapply(matches, function(x) x$`_user`, character(1)))
            if (length(universes) == 0) {
              stop("Package '", package, "' not found on r-universe", call. = FALSE)
            }
            universe <- universes[[1]]
            if (length(universes) > 1) {
              indexed <- vapply(
                universes,
                function(u) {
                  url <- paste0("https://", u, ".r-universe.dev/api/packages/", package)
                  info <- tryCatch(jsonlite::fromJSON(url), error = function(e) NULL)
                  isTRUE(info$`_indexed`)
                },
                logical(1)
              )
              if (any(indexed)) {
                universe <- universes[indexed][[1]]
              } else if (any(universes != "cran")) {
                universe <- universes[universes != "cran"][[1]]
              }
            }
            message(
              "Universe for ", package, ": ", universe,
              " (candidates: ", paste(universes, collapse = ", "), ")"
            )
            universe
          }

          # Packages already installed by install_from_universe(), to stop cycles
          # through Remotes.
          visited <- new.env()

          # Install the development version of a package from a universe,
          # as a binary for this runner where one is listed, else from source.
          # Only the universe-wide repositories serve packages,
          # a per-package URL such as https://<universe>.r-universe.dev/<package>/
          # answers with 403.
          install_from_universe <- function(package, universe) {
            if (exists(package, envir = visited, inherits = FALSE)) {
              return(invisible())
            }
            assign(package, TRUE, envir = visited)
            r_version <- sub("^([0-9]+[.][0-9]+).*$", "\\1", getRversion())
            base <- paste0("https://", universe, ".r-universe.dev")
            candidates <- c(
              binary = paste0(
                base, "/bin/linux/", distro, "-", R.version$arch, "/", r_version
              ),
              source = base
            )

            repo <- NULL
            for (candidate in candidates) {
              available <- utils::available.packages(repos = candidate)
              if (package %in% rownames(available)) {
                repo <- candidate
                break
              }
            }
            if (is.null(repo)) {
              stop(
                "Package '", package, "' not found in the r-universe repositories ",
                paste(candidates, collapse = " and "),
                call. = FALSE
              )
            }
            version <- available[package, "Version"]
            message("Installing ", package, " ", version, " from ", repo)

            destdir <- tempfile("universe")
            dir.create(destdir)
            on.exit(unlink(destdir, recursive = TRUE), add = TRUE)
            file <- utils::download.packages(
              package,
              destdir = destdir,
              available = available,
              repos = repo
            )[, 2]
            if (length(file) != 1 || !file.exists(file)) {
              stop("Failed to download ", package, " from ", repo, call. = FALSE)
            }

            # The repository index carries no Remotes field, the DESCRIPTION does.
            utils::untar(file, file.path(package, "DESCRIPTION"), exdir = destdir)
            desc <- read.dcf(file.path(destdir, package, "DESCRIPTION"))
            if ("Remotes" %in% colnames(desc)) {
              remotes <- trimws(strsplit(desc[, "Remotes"], ",")[[1]])
              remotes <- remotes[remotes != ""]
              pattern <- "^(?:github::)?([^/:]+)/([^/@#]+)$"
              for (remote in remotes) {
                if (grepl(pattern, remote, perl = TRUE)) {
                  install_from_universe(
                    sub(pattern, "\\2", remote, perl = TRUE),
                    sub(pattern, "\\1", remote, perl = TRUE)
                  )
                } else {
                  message("Not installing remote ", remote, ", only org/pkg is supported")
                }
              }
            }

            # Missing dependencies come from the universe or the usual repositories,
            # the package itself from the file downloaded from the universe.
            deps <- tools::package_dependencies(
              package,
              db = available,
              which = c("Depends", "Imports", "LinkingTo")
            )[[1]]
            missing <- setdiff(deps, c("R", rownames(utils::installed.packages())))
            if (length(missing) > 0) {
              utils::install.packages(missing, repos = c(universe = repo, getOption("repos")))
            }
            utils::install.packages(file, repos = NULL)

            installed <- utils::packageDescription(package, fields = "Version")
            message(package, ": installed ", installed, ", universe ", version)
            if (is.na(installed)) {
              stop("Package ", package, " is not installed", call. = FALSE)
            }
            if (package_version(installed) != package_version(version)) {
              stop(
                "Installed ", package, " ", installed,
                " differs from the universe's ", version,
                call. = FALSE
              )
            }
          }

          install_from_universe(package, universe_for(package))
        shell: Rscript {0}

      - name: Session info
        uses: cynkra/cynkratemplate/.github/actions/session-info@main

      - name: Run the repository-specific after-install steps
        uses: ./.github/workflows/custom/after-install
        if: hashFiles('.github/workflows/custom/after-install/action.yml') != ''

      - name: Update the testthat snapshots
        id: snapshots
        continue-on-error: true
        uses: cynkra/cynkratemplate/.github/actions/update-snapshots@main
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - name: Run R CMD check
        uses: cynkra/cynkratemplate/.github/actions/check@main
        with:
          results: ${{ matrix.package }}

      - name: Fail if a snapshot pull request was opened
        if: always() && steps.snapshots.outputs.pull-request-number != ''
        env:
          PR_NUMBER: ${{ steps.snapshots.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Snapshot pull request #${PR_NUMBER} was opened, see ${RUN_URL}"
          exit 1
        shell: bash
